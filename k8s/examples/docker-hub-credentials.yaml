# Example only. Replace placeholders locally; never commit a real access token.
# Kept outside kustomization so placeholders are not automatically deployed.
apiVersion: v1
kind: Secret
metadata:
  name: docker-hub-credentials
  namespace: scaffoldops-dev
type: Opaque
stringData:
  DOCKER_USERNAME: "<docker-hub-username>"
  DOCKER_PASSWORD: "<docker-hub-access-token>"
