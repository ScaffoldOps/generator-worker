spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.scaffoldops-dev.svc.cluster.local:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:generator-worker}

app:
  generation:
    manifest-output-dir: ${GENERATION_MANIFEST_OUTPUT_DIR:/var/lib/generator-worker/manifests}
    handoff-state-dir: ${GENERATION_HANDOFF_STATE_DIR:/var/lib/generator-worker/handoff}
  kafka:
    topics:
      artifact-cleanup-requested: ${ARTIFACT_CLEANUP_REQUESTED_TOPIC:artifact-cleanup-requested}
  lifecycle:
    base-url: ${GENERATOR_API_BASE_URL:http://generator-api-service.scaffoldops-dev.svc.cluster.local/api/generator/v1}
    http-enabled: ${GENERATOR_API_LIFECYCLE_HTTP_ENABLED:false}
    status-update-path: ${GENERATOR_API_LIFECYCLE_STATUS_UPDATE_PATH:/internal/generation-requests/{requestId}/status}
    auth:
      token-url: ${GENERATOR_API_TOKEN_URL:http://keycloak-dev.security.svc.cluster.local:8080/realms/scaffoldops-dev/protocol/openid-connect/token}
      client-id: ${GENERATOR_API_CLIENT_ID:scaffoldops-generator-worker}
