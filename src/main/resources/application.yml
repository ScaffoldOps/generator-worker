server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: generator-worker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:generator-worker}
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    listener:
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: false

info:
  app:
    title: ScaffoldOps Generator Worker
    description: Asynchronous worker shell for consuming generation jobs and driving generation lifecycle updates.
    version: 0.0.1-SNAPSHOT

app:
  kafka:
    topics:
      generation-requested: ${GENERATION_REQUESTED_TOPIC:generation-requested}
  lifecycle:
    base-url: ${GENERATOR_API_BASE_URL:http://generator-api-service}

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
