server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: generator-worker
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:generator-worker}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    listener:
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: false

info:
  app:
    title: ScaffoldOps Generator Worker
    description: Asynchronous worker shell for consuming generation jobs and driving generation lifecycle updates.
    version: 0.0.1-SNAPSHOT

app:
  generation:
    manifest-output-dir: ${GENERATION_MANIFEST_OUTPUT_DIR:${java.io.tmpdir}/generator-worker/manifests}
    handoff-state-dir: ${GENERATION_HANDOFF_STATE_DIR:${java.io.tmpdir}/generator-worker/handoff}
  kafka:
    topics:
      generation-requested: ${GENERATION_REQUESTED_TOPIC:generation-requested}
      deployment-requested: ${DEPLOYMENT_REQUESTED_TOPIC:deployment-requested}
      generation-requested-dlt: ${GENERATION_REQUESTED_DLT_TOPIC:generation-requested-dlt}
  lifecycle:
    base-url: ${GENERATOR_API_BASE_URL:http://generator-api-service}
    http-enabled: ${GENERATOR_API_LIFECYCLE_HTTP_ENABLED:false}
    status-update-path: ${GENERATOR_API_LIFECYCLE_STATUS_UPDATE_PATH:/internal/generation-requests/{requestId}/status}

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
